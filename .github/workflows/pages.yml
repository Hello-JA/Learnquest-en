name: Deploy preview to GitHub Pages

# A static shop-window for sharing the site before the Vercel deployment is
# live. Pages cannot run the /api backend, so this build is marked as a static
# preview and the waitlist form explains itself instead of failing.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it half-way.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check types
        run: npm run check

      - name: Test
        run: npm test

      - name: Build static site
        run: npx vite build
        env:
          # Pages serves from https://<user>.github.io/<repo>/
          VITE_BASE_PATH: /Learnquest-en/
          # No backend here — the waitlist form switches to a notice.
          VITE_STATIC_PREVIEW: "true"

      - name: Add SPA fallback
        # Pages has no rewrite rules, so a direct visit to /pricing 404s.
        # Serving index.html as the 404 page lets the client router take over.
        run: cp dist/public/index.html dist/public/404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
